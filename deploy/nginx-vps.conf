server {
    listen 80;
    server_name www.colors-cc.top;

    return 301 https://www.colors-cc.top$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.colors-cc.top;

    root /var/www/colors-cc/html;
    index index.html;

    # Keep the existing certificate paths used by this VPS.
    ssl_certificate /etc/letsencrypt/live/www.colors-cc.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.colors-cc.top/privkey.pem;

    location / {
        try_files $uri.html $uri $uri/ =404;
    }

    location = /404.txt {
        internal;
        default_type text/plain;
        charset utf-8;
    }

    error_page 404 /404.txt;
}
