server {
    listen 80;
    server_name www.colors-cc.top;

    return 301 https://www.colors-cc.top$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.colors-cc.top;

    root /var/www/colors-cc/html;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Keep the existing certificate paths used by this VPS.
    ssl_certificate /etc/letsencrypt/live/www.colors-cc.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.colors-cc.top/privkey.pem;

    # Hono SSG emits clean routes as sibling .html files while localized tool
    # routes also create /en and /zh directories. Resolve the .html file first
    # and never redirect a canonical route to the colliding directory.
    location = / {
        try_files /index.html =404;
    }

    location ~ ^(.+)/$ {
        return 301 $scheme://$host$1$is_args$args;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files /sitemap.xml =404;
    }

    location = /sitemap.txt {
        default_type text/plain;
        try_files /sitemap.txt =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files /site.webmanifest =404;
    }

    location / {
        try_files $uri.html $uri =404;
    }

    location = /404.txt {
        internal;
        default_type text/plain;
        charset utf-8;
    }

    error_page 404 /404.txt;
}
