server {
    listen 80;
    listen [::]:80;
    server_name www.colors-cc.top;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.colors-cc.top;

    root /var/www/colors-cc.top;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_certificate /etc/nginx/ssl/colors-cc.top_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/colors-cc.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "0";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Hono SSG emits clean routes as sibling .html files while localized tool
    # routes also create /en and /zh directories. Resolve the .html file first
    # and never redirect a canonical route to the colliding directory.
    location = / {
        try_files /index.html =404;
    }

    location ~ ^(.+)/$ {
        return 301 $scheme://$host$1$is_args$args;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files /sitemap.xml =404;
    }

    location = /sitemap.txt {
        default_type text/plain;
        try_files /sitemap.txt =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files /site.webmanifest =404;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri.html $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /404.txt {
        internal;
        default_type text/plain;
        charset utf-8;
    }

    error_page 404 /404.txt;
}
